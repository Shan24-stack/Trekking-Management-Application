<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <div class="sidebar">

        <h3>Trek Staff</h3>

        <a href="{{ url_for('staff_dashboard') }}">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>

        <a href="{{ url_for('my_treks') }}" class="active">
            <i class="bi bi-map"></i>
            <span>My Treks</span>
        </a>

        <a href="{{ url_for('staff_profile') }}">
            <i class="bi bi-person"></i>
            <span>Profile</span>
        </a>

        <a href="{{ url_for('logout') }}">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="topbar">

            <h3>Trekking Management Application</h3>

            <div>

                <i class="bi bi-person-circle fs-3"></i>

                {{ current_user.fullname }}

            </div>

        </div>

        <div class="table-box">

            <h2>Edit Assigned Trek</h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Trek Name
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ trek.name }}"
                           readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Available Slots
                    </label>

                    <input type="number"
                           class="form-control"
                           name="available_slots"
                           value="{{ trek.available_slots }}"
                           min="0"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Status
                    </label>

                    <select class="form-select"
                            name="status">

                        <option value="Open"
                        {% if trek.status=="Open" %}selected{% endif %}>
                            Open
                        </option>

                        <option value="Closed"
                        {% if trek.status=="Closed" %}selected{% endif %}>
                            Closed
                        </option>

                        <option value="Started"
                        {% if trek.status=="Started" %}selected{% endif %}>
                            Started
                        </option>

                        <option value="Ongoing"
                        {% if trek.status=="Ongoing" %}selected{% endif %}>
                            Ongoing
                        </option>

                        <option value="Completed"
                        {% if trek.status=="Completed" %}selected{% endif %}>
                            Completed
                        </option>

                    </select>

                </div>

                <button class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>

                    Save Changes

                </button>

                <a href="{{ url_for('my_treks') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
